name: Deploy

permissions:
  contents: read
  actions: write
  id-token: write # Required for OIDC

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - development
          - production
      skip_tests:
        description: 'Skip tests (use with caution!)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: geoffmilleraz/trm/devbox
  TERRAFORM_VERSION: "1.9.5"

jobs:
  # Determine deployment environment
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      env_dir: ${{ steps.set-env.outputs.env_dir }}

    steps:
    - name: Set environment based on branch
      id: set-env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENVIRONMENT="${{ github.event.inputs.environment }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="production"
        elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
          ENVIRONMENT="development"
        else
          echo "Unknown branch: ${{ github.ref }}"
          exit 1
        fi

        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

        if [[ "$ENVIRONMENT" == "production" ]]; then
          echo "env_dir=prod" >> $GITHUB_OUTPUT
        else
          echo "env_dir=dev" >> $GITHUB_OUTPUT
        fi

        echo "Deploying to: $ENVIRONMENT"

  # Run full test suite
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: determine-environment
    if: false # Temporarily disabled by user request
    # if: github.event.inputs.skip_tests != 'true'

    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Nix store
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/nix
          /nix/store
        key: nix-store-${{ runner.os }}-${{ hashFiles('devbox.json') }}
        restore-keys: |
          nix-store-${{ runner.os }}-

    - name: Cache Devbox downloads
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/devbox
          ~/.local/share/devbox
        key: devbox-downloads-${{ runner.os }}-${{ hashFiles('devbox.json') }}
        restore-keys: |
          devbox-downloads-${{ runner.os }}-

    - name: Install Devbox
      uses: jetify-com/devbox-install-action@v0.13.0
      with:
        enable-cache: 'true'
        project-path: '.'
      env:
        DEVBOX_NO_REFRESH: 'true'

    - name: Cache UV packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Run quality checks
      run: |
        echo "::group::Linting"
        devbox run -- task python:lint
        echo "::endgroup::"

        echo "::group::Format Check"
        devbox run -- task python:format:check
        echo "::endgroup::"

        echo "::group::Type Check"
        devbox run -- task python:type-check || true
        echo "::endgroup::"

    - name: Wait for DynamoDB to be ready
      run: |
        echo "Waiting for DynamoDB to be ready..."
        for i in {1..30}; do
          if devbox run -- python -c "import requests; requests.get('http://localhost:8000')" 2>/dev/null; then
            echo "DynamoDB is ready!"
            break
          fi
          sleep 2
        done

    - name: Run tests
      run: |
        echo "::group::Unit Tests"
        devbox run -- task test:coverage
        echo "::endgroup::"

        echo "::group::Integration Tests"
        devbox run -- task test:integration || true
        echo "::endgroup::"
      env:
        DYNAMODB_ENDPOINT: http://localhost:8000
        ENVIRONMENT: testing
        PYTHONPATH: .

    - name: Check coverage threshold
      run: |
        coverage=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.get('line-rate')) * 100)")
        echo "Coverage: ${coverage}%"
        if (( $(echo "$coverage < 80" | bc -l) )); then
          echo "⚠️ Coverage is below 80% threshold"
        fi

  # Build production Docker image
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: success()

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2 # Static region for ECR login

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.login-ecr.outputs.registry }}/trm-blockexplorer
        tags: |
          type=ref,event=branch
          type=raw,value=${{ needs.determine-environment.outputs.environment }}-latest

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: |
          type=gha,scope=shared
          type=registry,ref=${{ steps.login-ecr.outputs.registry }}/trm-blockexplorer:buildcache
        cache-to: |
          type=gha,mode=max,scope=shared
          type=registry,ref=${{ steps.login-ecr.outputs.registry }}/trm-blockexplorer:buildcache,mode=max,compression=zstd,oci-mediatypes=true
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VERSION=${{ needs.determine-environment.outputs.environment }}-${{ github.sha }}

  # Generate Terraform plans
  terraform-plan:
    name: Terraform Plan (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: success()
    strategy:
      fail-fast: false
      matrix:
        component: [global, us-west-2, us-east-2]
        include:
          - component: us-west-2
            aws_region: us-west-2
          - component: us-east-2
            aws_region: us-east-2

    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ matrix.aws_region || 'us-east-1' }}

    - name: Cache Terraform plugins
      uses: actions/cache@v4
      with:
        path: |
          ~/.terraform.d/plugin-cache
          **/.terraform/providers
        key: terraform-${{ runner.os }}-${{ hashFiles('**/*.tf', '**/terraform.lock.hcl') }}
        restore-keys: |
          terraform-${{ runner.os }}-

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
        terraform_wrapper: false

    - name: Plan Terraform changes
      id: plan
      run: |
        cd iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/${{ matrix.component }}
        terraform init -backend-config=backend-config.hcl
        terraform plan -out=tfplan -lock-timeout=30s -no-color

        HAS_CHANGES=false
        if terraform show -json tfplan | jq -e '.resource_changes[] | select(.change.actions | any(. == "create" or . == "update" or . == "delete"))' > /dev/null 2>&1; then
          HAS_CHANGES=true
        fi
        echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

    - name: Upload Terraform plan
      uses: actions/upload-artifact@v4
      with:
        name: tfplan-${{ matrix.component }}
        path: iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/${{ matrix.component }}/tfplan
        retention-days: 1

  # OPA Policy validation
  opa-validate:
    name: OPA Policy Validation
    runs-on: ubuntu-latest
    needs: [determine-environment, terraform-plan]
    if: false # Temporarily disabled by user request
    # if: needs.terraform-plan.outputs.has_changes == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Terraform plans
      uses: actions/download-artifact@v4
      with:
        name: tfplan-global
        path: iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/global/
    - uses: actions/download-artifact@v4
      with:
        name: tfplan-us-west-2
        path: iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/us-west-2/
    - uses: actions/download-artifact@v4
      with:
        name: tfplan-us-east-2
        path: iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/us-east-2/

    - name: Install OPA
      run: |
        curl -L -o opa https://openpolicyagent.org/downloads/v0.31.0/opa_linux_amd64_static
        chmod +x ./opa
        sudo mv ./opa /usr/local/bin/

    - name: Validate policies
      run: |
        for component in global us-west-2 us-east-2; do
          PLAN_PATH="iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/$component/tfplan"
          if [ -f "$PLAN_PATH" ]; then
            echo "::group::Validating $component"
            terraform show -json $PLAN_PATH > plan.json
            opa exec --decision 'data.terraform.deny' --bundle iac/policies/opa/ plan.json
            echo "::endgroup::"
          fi
        done

  # Manual approval for production
  approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: [determine-environment, build-docker, terraform-plan]
    if: |
      always() &&
      needs.determine-environment.outputs.environment == 'production' &&
      needs.build-docker.result == 'success' &&
      needs.terraform-plan.result == 'success'
    environment:
      name: production
      url: https://trm.geoffmiller.cloud

    steps:
    - name: Approval Summary
      run: |
        echo "## 🚀 Production Deployment Request"
        echo "Please review the changes and approve to proceed with production deployment."

  # Deploy infrastructure
  deploy-global:
    name: Deploy Global Infrastructure
    runs-on: ubuntu-latest
    needs: [determine-environment, terraform-plan, approval]
    if: |
      needs.terraform-plan.result == 'success' &&
      (needs.approval.result == 'success' || needs.determine-environment.outputs.environment == 'development')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - name: Download Terraform plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan-global
        path: iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/global/
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
    - name: Apply Terraform changes
      run: |
        cd iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/global
        terraform apply -auto-approve tfplan

  deploy-us-west-2:
    name: Deploy us-west-2 Infrastructure
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-global]
    if: success()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
    - name: Download Terraform plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan-us-west-2
        path: iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/us-west-2/
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
    - name: Apply Terraform changes
      run: |
        cd iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/us-west-2
        terraform apply -auto-approve tfplan

  deploy-us-east-2:
    name: Deploy us-east-2 Infrastructure
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-us-west-2]
    if: success()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2
    - name: Download Terraform plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan-us-east-2
        path: iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/us-east-2/
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
    - name: Apply Terraform changes
      run: |
        cd iac/deploy/${{ needs.determine-environment.outputs.env_dir }}/us-east-2
        terraform apply -auto-approve tfplan

  # Post-deployment validation
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-us-east-2]
    if: always() && needs.deploy-us-east-2.result == 'success'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run smoke tests
      run: |
        echo "::group::Running smoke tests for ${{ needs.determine-environment.outputs.environment }}"
        # Add smoke tests here, e.g., curl endpoints
        echo "::endgroup::"

    - name: Performance baseline
      if: needs.determine-environment.outputs.environment == 'production'
      run: |
        echo "Recording performance baseline..."
        # Add performance testing here

  # Notification
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [determine-environment, build-docker, deploy-us-east-2, smoke-tests]
    if: always()

    steps:
    - name: Generate deployment summary
      run: |
        echo "Deployment to ${{ needs.determine-environment.outputs.environment }} finished with status: ${{ job.status }}"

    - name: Create issue on failure
      if: |
        needs.smoke-tests.result != 'success' &&
        needs.determine-environment.outputs.environment == 'production'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Production deployment failed on ${{ github.sha }}`,
            body: 'The production deployment failed. Please investigate.\n\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          })
