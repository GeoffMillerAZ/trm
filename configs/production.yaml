# Configuration for production environment
environment: "production"
debug: false

# API Configuration
api_title: "TRM Block Explorer API"
api_version: "2.0.0"
api_description: "Production blockchain analysis and compliance API"

# Infrastructure
use_file_based_infrastructure: false

# Cache Configuration (Production ElastiCache)
cache_enabled: true
redis_url: "${REDIS_URL}"
redis_password: "${REDIS_PASSWORD}"
cache_ttl_seconds: 300

# Database Configuration (Production DynamoDB)
dynamodb_endpoint: null  # Use AWS DynamoDB
aws_region: "${AWS_REGION}"
aws_access_key_id: "${AWS_ACCESS_KEY_ID}"
aws_secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
aws_session_token: "${AWS_SESSION_TOKEN}"

# Table Names (Production)
address_watchlist_table: "address-watchlist-prod"
suspicious_transactions_table: "suspicious-transactions-prod"
investigation_notes_table: "investigation-notes-prod"

# Infura Configuration (Production)
infura_api_key: "${INFURA_API_KEY}"
infura_network: "mainnet"
infura_project_secret: "${INFURA_PROJECT_SECRET}"

# Logging Configuration
log_level: "INFO"
log_format: "json"
enable_cloudwatch_logging: true
cloudwatch_log_group: "trm-blockexplorer-prod"
cloudwatch_log_stream: "api-prod"
log_rotation_size: "500MB"
log_rotation_count: 30

# Secrets Configuration (AWS Secrets Manager)
secrets_backend: "aws"
secrets_prefix: "trm-blockexplorer/"
parameters_prefix: "/trm-blockexplorer/"

# Tracing Configuration
tracing_backend: "xray"
tracing_service_name: "trm-blockexplorer"
tracing_sampling_rate: 0.05  # 5% sampling for production
enable_xray_local_mode: false
tracing_enabled: true

# Health Check Configuration
health_check_timeout: 30
health_check_interval: 30

# Rate Limiting (Production limits)
rate_limit_enabled: true
rate_limit_requests_per_minute: 60
rate_limit_burst: 10

# API Configuration
api_cors_origins: ["https://app.example.com", "https://dashboard.example.com"]
api_cors_methods: ["GET", "POST", "PUT", "DELETE"]
api_max_request_size: 1048576  # 1MB
api_timeout: 30

# Monitoring Configuration
metrics_enabled: true
metrics_port: 9090
prometheus_enabled: true

# Production Settings
enable_cors: true
cors_origins: ["https://app.example.com", "https://dashboard.example.com"]