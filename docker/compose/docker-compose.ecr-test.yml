# Test ECR image locally with filesystem mocks
# Usage: docker-compose -f docker/compose/docker-compose.ecr-test.yml up

services:
  # Local DynamoDB
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    platform: linux/amd64
    ports:
      - "8011:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      - trm-network

  # DynamoDB Admin UI
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    platform: linux/amd64
    ports:
      - "8012:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb-local
    networks:
      - trm-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - trm-network

  # Redis Commander for Redis UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    ports:
      - "8013:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trm-network

  # DynamoDB table initializer
  dynamodb-init:
    image: amazon/aws-cli:latest
    platform: linux/amd64
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-west-2
    networks:
      - trm-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Waiting for DynamoDB to be ready...'
        sleep 10

        echo 'Creating DynamoDB tables...'

        # Create AddressWatchlist table
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name AddressWatchlist-local \
          --attribute-definitions AttributeName=address,AttributeType=S \
          --key-schema AttributeName=address,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --region us-west-2 || echo "Table AddressWatchlist-local already exists or error"

        # Create SuspiciousTransactions table
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name SuspiciousTransactions-local \
          --attribute-definitions AttributeName=transactionHash,AttributeType=S AttributeName=timestamp,AttributeType=N \
          --key-schema AttributeName=transactionHash,KeyType=HASH AttributeName=timestamp,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          --region us-west-2 || echo "Table SuspiciousTransactions-local already exists or error"

        # Create InvestigationNotes table
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name InvestigationNotes-local \
          --attribute-definitions AttributeName=noteId,AttributeType=S AttributeName=address,AttributeType=S \
          --key-schema AttributeName=noteId,KeyType=HASH \
          --global-secondary-indexes '[{"IndexName":"AddressIndex","Keys":[{"AttributeName":"address","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}]' \
          --billing-mode PAY_PER_REQUEST \
          --region us-west-2 || echo "Table InvestigationNotes-local already exists or error"

        echo 'Tables created successfully!'

        # Insert test data
        aws dynamodb put-item \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name AddressWatchlist-local \
          --item '{"address": {"S": "0x742d35Cc6634C0532925a3b844Bc9e7595f62b0e"}, "label": {"S": "Test Suspicious Address"}, "risk_score": {"N": "85"}, "added_date": {"S": "2024-01-01"}}' \
          || echo "Test data insert error"

        echo 'Test data inserted!'

  # TRM Block Explorer API from ECR
  trm-api:
    image: 754419183698.dkr.ecr.us-west-2.amazonaws.com/trm-blockexplorer:latest
    platform: linux/amd64
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--loop", "uvloop", "--access-log"]
    ports:
      - "8080:8000"
    environment:
      # Basic configuration
      PROJECT_NAME: trm-blockexplorer
      ENVIRONMENT: local
      REGION: us-west-2
      PORT: 8000
      LOG_LEVEL: DEBUG

      # AWS credentials for local DynamoDB
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-west-2

      # IMPORTANT: Point to local DynamoDB
      AWS_ENDPOINT_URL: http://dynamodb-local:8000
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000

      # Table names
      ADDRESS_WATCHLIST_TABLE: AddressWatchlist-local
      SUSPICIOUS_TRANSACTIONS_TABLE: SuspiciousTransactions-local
      INVESTIGATION_NOTES_TABLE: InvestigationNotes-local

      # Mock blockchain provider (local filesystem)
      BLOCKCHAIN_PROVIDER: mock
      MOCK_DATA_PATH: /app/mock-data

      # Infura keys (not used in mock mode but required by app)
      INFURA_API_KEY: mock-key
      INFURA_API_SECRET: mock-secret

      # Additional settings
      CACHE_TTL_MINUTES: 5
      API_TIMEOUT_SECONDS: 30
      ENABLE_TRACING: false
      MAX_RETRY_ATTEMPTS: 3

      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379

    volumes:
      # Mount mock data directory
      - ./test-data/mock-blockchain:/app/mock-data:ro
      # Mount local config if needed
      - ./config/local:/app/config:ro
    depends_on:
      dynamodb-local:
        condition: service_started
      redis:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - trm-network

networks:
  trm-network:
    driver: bridge
