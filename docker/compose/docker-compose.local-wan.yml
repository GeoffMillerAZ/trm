# Local WAN configuration - local mocks with real Ethereum blockchain via Infura
# Usage:
#   export INFURA_API_KEY=your_actual_api_key
#   docker-compose -f docker/compose/docker-compose.local-wan.yml up

services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # DynamoDB Local for database
  dynamodb:
    image: amazon/dynamodb-local:latest
    ports:
      - "8001:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "echo 'healthy'"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Initialize DynamoDB table
  init-dynamodb:
    image: amazon/aws-cli:latest
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ../../scripts/init-dynamodb.sh:/init-dynamodb.sh:ro
    entrypoint: ["/bin/bash", "/init-dynamodb.sh"]
    depends_on:
      dynamodb:
        condition: service_healthy

  # API with local mocks but real Infura API
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      # Use local-wan configuration
      - ENVIRONMENT=local
      - USE_FILE_BASED_INFRASTRUCTURE=false
      - CONFIG_FILE=configs/local-wan.yaml

      # Redis configuration (local mock)
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=true
      - CACHE_TTL_SECONDS=60

      # DynamoDB configuration (local mock)
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - DYNAMODB_TABLE_NAME=trm-blockexplorer-local-wan
      - AWS_REGION=us-west-2
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local

      # Real Infura API configuration
      - INFURA_API_KEY=${INFURA_API_KEY}
      - INFURA_NETWORK=mainnet

      # Logging configuration
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text
      - ENABLE_CLOUDWATCH_LOGGING=false

      # Tracing configuration
      - TRACING_BACKEND=console
      - TRACING_SERVICE_NAME=trm-blockexplorer-local-wan

      # Secrets backend
      - SECRETS_BACKEND=file
      - SECRETS_FILE_PATH=workspace/secrets/local.json

      # API Configuration
      - API_TITLE=TRM Block Explorer API (Local WAN)
      - DEBUG=true

      # CORS for testing tools
      - ENABLE_CORS=true
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:8080"]

    volumes:
      - ../../src:/app/src
      - ../../workspace:/app/workspace
      - ../../configs:/app/configs:ro
    depends_on:
      redis:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
      init-dynamodb:
        condition: service_completed_successfully
    command: python -m src.main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  redis-data:
    driver: local

networks:
  default:
    name: trm-local-wan
