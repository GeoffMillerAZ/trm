services:
  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # DynamoDB Local for database
  dynamodb:
    image: amazon/dynamodb-local:latest
    ports:
      - "8001:8000"
    # Using in-memory mode for now to avoid permission issues
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "echo 'healthy'"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Initialize DynamoDB table
  init-dynamodb:
    image: amazon/aws-cli:latest
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ../../scripts/init-dynamodb.sh:/init-dynamodb.sh:ro
    entrypoint: ["/bin/bash", "/init-dynamodb.sh"]
    depends_on:
      dynamodb:
        condition: service_healthy

  # API with real services
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Use local environment with real services
      - ENVIRONMENT=local
      - USE_MOCK_BLOCKCHAIN=true
      - USE_FILE_BASED_INFRASTRUCTURE=false

      # Redis configuration
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=true
      - CACHE_TTL_SECONDS=300

      # DynamoDB configuration
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - DYNAMODB_TABLE_NAME=trm-blockexplorer
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local

      # Logging configuration
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=json
      - ENABLE_CLOUDWATCH_LOGGING=false

      # Tracing configuration
      - TRACING_BACKEND=console
      - TRACING_SERVICE_NAME=trm-blockexplorer-services

      # Secrets backend
      - SECRETS_BACKEND=environment

      # API Configuration
      - API_TITLE=TRM Block Explorer API (Services Mode)
      - DEBUG=true

      # CORS for testing tools
      - ENABLE_CORS=true
      - CORS_ORIGINS=["*"]

      # Infura key (using mock blockchain anyway)
      - INFURA_API_KEY=dummy_key_for_services_testing

    depends_on:
      redis:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
      init-dynamodb:
        condition: service_completed_successfully
    command: uv run python -m src.main
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Optional: Swagger UI for testing
  api-tester:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8080:8080"
    environment:
      - URL=http://localhost:8000/openapi.json
    depends_on:
      - api


volumes:
  redis-data:
